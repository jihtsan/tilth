name: Release

on:
  push:
    tags: ["v*"]
  # A change to the pipeline itself builds and smoke-checks every target on
  # the pull request. The jobs that publish run on a tag only.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/check/release_smoke.py
      - scripts/check/release_smoke/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fail fast if any version in the release disagrees with the tag. tilth and
  # tilth-core move in lockstep: the crate versions equal the tag, and tilth
  # requires exactly that version of tilth-core, because it reaches into the
  # library's hidden modules. A pull request has no tag, so there the
  # versions are checked against tilth's own.
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - name: Verify versions match tag
        id: versions
        run: |
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="$CARGO_VER"
          fi
          CORE_VER=$(grep '^version' crates/tilth-core/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          CORE_REQS=$(grep '^tilth-core = ' Cargo.toml | sed 's/.*version = "\([^"]*\)".*/\1/' | sort -u)
          NPM_VER=$(node -p "require('./npm/package.json').version")
          echo "Tag: $TAG  Cargo: $CARGO_VER  tilth-core: $CORE_VER  tilth-core required: $CORE_REQS  npm: $NPM_VER"
          if [ "$CARGO_VER" != "$TAG" ]; then
            echo "::error::Cargo.toml version ($CARGO_VER) does not match tag ($TAG)"
            exit 1
          fi
          if [ "$CORE_VER" != "$TAG" ]; then
            echo "::error::crates/tilth-core/Cargo.toml version ($CORE_VER) does not match tag ($TAG)"
            exit 1
          fi
          if [ "$CORE_REQS" != "=$TAG" ]; then
            echo "::error::Cargo.toml requires tilth-core $CORE_REQS, not exactly the tag's version (=$TAG)"
            exit 1
          fi
          if [ "$NPM_VER" != "$TAG" ]; then
            echo "::error::npm/package.json version ($NPM_VER) does not match tag ($TAG)"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6

      # The release builds on the toolchain rust-toolchain.toml pins, the one
      # CI lints and tests on.
      - run: rustup toolchain install --no-self-update
      - run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # ratchet:Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Install cross for Linux targets (cross-compiles via Docker)
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      # Build
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
        shell: bash

      # Package — unix
      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../tilth-${{ matrix.target }}.tar.gz tilth
          cd ../../..

      # Package — windows
      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../tilth-${{ matrix.target }}.zip tilth.exe
          cd ../../..

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
        with:
          name: tilth-${{ matrix.target }}
          path: tilth-${{ matrix.target }}.*
          if-no-files-found: error

  # Each packaged binary runs on its own platform before anything ships:
  # its version, an MCP initialize and one search. A cross-built target
  # gets a runner of its own architecture.
  smoke:
    needs: [version-check, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-26-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    env:
      VERSION: ${{ needs.version-check.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8
        with:
          name: tilth-${{ matrix.target }}

      - name: Smoke check (unix)
        if: runner.os != 'Windows'
        run: |
          tar xzf tilth-${{ matrix.target }}.tar.gz
          python3 scripts/check/release_smoke.py tilth "$VERSION"

      - name: Smoke check (windows)
        if: runner.os == 'Windows'
        run: |
          7z x tilth-${{ matrix.target }}.zip
          python scripts/check/release_smoke.py tilth.exe "$VERSION"

  # One upload of every archive, once all of them ran, so a failed smoke
  # check leaves no partial release behind.
  github-release:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # softprops/action-gh-release uploads release assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8
        with:
          pattern: tilth-*
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # ratchet:softprops/action-gh-release@v3
        with:
          files: |
            tilth-*.tar.gz
            tilth-*.zip
          generate_release_notes: true

  # After the release assets, publish to crates.io. tilth depends on
  # tilth-core by version, so the library goes first; cargo waits until the
  # registry serves it before the binary's publish resolves the dependency.
  publish-crate:
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - run: rustup toolchain install --no-self-update
      - name: Publish tilth-core
        run: cargo publish --locked -p tilth-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish tilth
        run: cargo publish --locked -p tilth
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # After the release assets, publish to npm. The npm package downloads its
  # binary from them on install.
  publish-npm:
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): no NPM_TOKEN needed; provenance is automatic.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1. Major-pinned: `latest` moved to
      # npm 12, which requires a newer node than the runner guarantees.
      - run: npm install -g npm@11
      # Primary package: unscoped `tilth`
      - run: npm publish ./npm
      # Anchor the @plotplot org: dual-publish the SAME artifact as `@plotplot/tilth`.
      # Requires a trusted publisher for @plotplot/tilth configured on npmjs.com (one-time).
      # Best-effort: the unscoped `tilth` publish above is the canonical release, so a
      # failure here (e.g. the @plotplot trusted publisher isn't configured yet) must not
      # fail the release. continue-on-error keeps the job green; if it fails, publish the
      # scope manually when ready — `cd npm && npm pkg set name=@plotplot/tilth && npm publish --access public`.
      - name: Dual-publish under the @plotplot scope
        continue-on-error: true
        working-directory: ./npm
        run: |
          npm pkg set name=@plotplot/tilth
          npm publish --access public
